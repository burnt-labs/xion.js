# This workflow will release the packages with Changesets

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish to npm
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🥡 Setup pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🟢 Setup node
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 🧩 Install Dependencies
        id: install-dependencies
        run: pnpm install

      - name: 🔨 Generate AA API Types
        id: generate-types
        run: pnpm generate:types

      - name: 🏗️ Build
        id: build-the-mono-repo
        run: pnpm build

      - name: 🔐 Configure git signing
        run: |
          echo "${{ secrets.SSH_SIGNING_PK }}" > /tmp/.git_signing_key
          chmod 600 /tmp/.git_signing_key
          git config user.name "isburnt"
          git config user.email "197779235+isburnt@users.noreply.github.com"
          git config commit.gpgsign true
          git config gpg.format ssh
          git config user.signingkey /tmp/.git_signing_key

      - name: 📣 Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): version packages 🦋"
          publish: pnpm publish:packages
          version: pnpm version:packages
          commit: "chore: update versions"
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm publishes are not transactional: changesets can publish some
      # packages and fail on others (e.g. ENEEDAUTH on 2026-06-11 left
      # abstraxion-react-native@latest depending on an unpublished
      # abstraxion-js version). This gate makes any partial publish or
      # broken dependency train fail the workflow with an explicit report.
      # Runs even when the changesets step failed, so the report shows
      # exactly which versions are missing from npm.
      - name: 🚦 Verify npm dependency train
        if: always() && (steps.changesets.outcome == 'success' || steps.changesets.outcome == 'failure')
        run: node scripts/verify-npm-dependency-train.mjs --require-local-published
