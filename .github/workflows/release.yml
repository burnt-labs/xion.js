# Release the packages with Changesets through the organization's shared flow
# (burnt-labs/github-workflows npm-changesets.yml). Merges accumulate
# changeset files, the flow maintains the version pull request, and merging
# that pull request publishes to npm via OIDC trusted publishing, with no npm
# token.
#
# This file is every published package's npm trusted publisher: OIDC
# identifies the top-level workflow, so the filename must stay release.yml.
#
# The shared flow runs the gates in .github/quality-policy.jsonc first, then
# builds and publishes on Ubicloud. Its release job serializes runs per
# repository without cancelling, because a run cancelled between publishing
# and tagging leaves versions on the registry with nothing behind them. That
# is why this caller declares no concurrency of its own.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      # The version pull request, and the tags and releases Changesets
      # creates after publishing.
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC).
      id-token: write
    uses: burnt-labs/github-workflows/.github/workflows/npm-changesets.yml@c7814463307c0e3d8025dca0e028cb3361e26c8e # v1.10.0
    with:
      version-command: pnpm version:packages
      publish-command: pnpm publish:packages
      # npm publishes are not transactional: changesets can publish some
      # packages and fail on others (e.g. ENEEDAUTH on 2026-06-11 left
      # abstraxion-react-native@latest depending on an unpublished
      # abstraxion-js version). The shared flow runs this after any publish
      # attempt, a failed one included, and it fails the run with a report of
      # which versions are missing from npm.
      post-publish-command: node scripts/verify-npm-dependency-train.mjs --require-local-published
      pr-title: "chore(release): version packages 🦋"
      pr-commit: "chore: update versions"
