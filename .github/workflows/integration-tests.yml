name: Integration Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_environment:
        description: "Integration test environment"
        required: false
        type: choice
        options:
          - testnet
          - mainnet
        default: "testnet"
      aa_api_url:
        description: "Custom AA API URL to use for integration tests"
        required: false
        type: string
  push:
    branches:
      - main
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build packages
    runs-on: ubicloud-standard-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Generate AA API Types
        run: pnpm generate:types

      - name: Build
        run: pnpm turbo run build --filter=@burnt-labs/abstraxion-js...

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/*/dist
          retention-days: 1

  integration-suite:
    name: SDK integration suite (${{ github.event.inputs.test_environment || 'testnet' }})
    runs-on: ubicloud-standard-8
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup integration environment (pnpm + deps + artifacts)
        uses: ./.github/actions/setup-integration-env
        with:
          install-playwright: "false"

      - name: Load Test Configuration
        id: config
        run: |
          TEST_ENV="${{ github.event.inputs.test_environment || 'testnet' }}"
          echo "test_environment=$TEST_ENV" >> "$GITHUB_OUTPUT"

          chmod +x .github/scripts/load-test-config.sh
          source .github/scripts/load-test-config.sh "$TEST_ENV"

          if [ -n "${{ github.event.inputs.aa_api_url }}" ]; then
            FINAL_AA_API_URL="${{ github.event.inputs.aa_api_url }}"
          else
            FINAL_AA_API_URL="$XION_AA_API_URL"
          fi

          echo "aa_api_url=$FINAL_AA_API_URL" >> "$GITHUB_OUTPUT"
          echo "XION_AA_API_URL=$FINAL_AA_API_URL" >> "$GITHUB_ENV"

      - name: Run Integration Tests
        id: run-tests
        env:
          TEST_ENVIRONMENT: ${{ steps.config.outputs.test_environment }}
          XION_TESTNET_CHAIN_ID: ${{ env.XION_TESTNET_CHAIN_ID }}
          XION_TESTNET_RPC_URL: ${{ env.XION_TESTNET_RPC_URL }}
          XION_TESTNET_REST_URL: ${{ env.XION_TESTNET_REST_URL }}
          XION_TESTNET_GAS_PRICE: ${{ env.XION_TESTNET_GAS_PRICE }}
          XION_TESTNET_FEE_GRANTER: ${{ env.XION_TESTNET_FEE_GRANTER }}
          XION_TESTNET_AA_API_URL: ${{ steps.config.outputs.test_environment == 'testnet' && steps.config.outputs.aa_api_url || env.XION_TESTNET_AA_API_URL }}
          XION_TESTNET_TREASURY_ADDRESS: ${{ env.XION_TESTNET_TREASURY_ADDRESS }}
          XION_TESTNET_INDEXER_URL: ${{ secrets.XION_TESTNET_INDEXER_URL }}
          XION_TESTNET_TREASURY_INDEXER_URL: ${{ secrets.XION_TESTNET_TREASURY_INDEXER_URL }}
          XION_MAINNET_CHAIN_ID: ${{ env.XION_MAINNET_CHAIN_ID }}
          XION_MAINNET_RPC_URL: ${{ env.XION_MAINNET_RPC_URL }}
          XION_MAINNET_REST_URL: ${{ env.XION_MAINNET_REST_URL }}
          XION_MAINNET_GAS_PRICE: ${{ env.XION_MAINNET_GAS_PRICE }}
          XION_MAINNET_FEE_GRANTER: ${{ env.XION_MAINNET_FEE_GRANTER }}
          XION_MAINNET_TREASURY_ADDRESS: ${{ env.XION_MAINNET_TREASURY_ADDRESS }}
          XION_MAINNET_AA_API_URL: ${{ secrets.XION_MAINNET_AA_API_URL }}
          XION_MAINNET_INDEXER_URL: ${{ secrets.XION_MAINNET_INDEXER_URL }}
          XION_MAINNET_TREASURY_INDEXER_URL: ${{ secrets.XION_MAINNET_TREASURY_INDEXER_URL }}
          TEST_TIMEOUT: ${{ env.TEST_TIMEOUT }}
          INTEGRATION_TEST_TIMEOUT: ${{ env.INTEGRATION_TEST_TIMEOUT }}
          NODE_ENV: test
          CI: true
        run: |
          echo "Running integration tests"
          echo "Environment: $TEST_ENVIRONMENT"
          echo "AA-API URL: ${{ steps.config.outputs.aa_api_url }}"

          set +e

          pnpm --filter @burnt-labs/abstraxion-js test:integration 2>&1 | tee abstraxion-results.txt
          ABSTRAXION_EXIT=${PIPESTATUS[0]}

          set -e

          TOTAL_FAILED=0

          if [ -f abstraxion-results.txt ]; then
            FAILED=$(grep -a 'Tests' abstraxion-results.txt 2>/dev/null | grep -oP '\d+(?=\s+failed)' | head -1 || echo "0")
            TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
          fi

          if [ -f abstraxion-results.txt ]; then
            ABSTRAXION_SUMMARY=$(grep -a -E "Test Files|Tests.*failed|Tests.*passed|Start at|Duration" abstraxion-results.txt 2>/dev/null | grep -v "Error:" | tail -4 || echo "No summary available")
            {
              echo "abstraxion_summary<<EOF_ABS"
              echo "$ABSTRAXION_SUMMARY"
              echo "EOF_ABS"
            } >> "$GITHUB_OUTPUT"
          else
            echo "abstraxion_summary=No results" >> "$GITHUB_OUTPUT"
          fi

          echo "total_failed=$TOTAL_FAILED" >> "$GITHUB_OUTPUT"

          if [ "$ABSTRAXION_EXIT" -ne 0 ]; then
            echo "test_status=failed" >> "$GITHUB_OUTPUT"
            exit "$ABSTRAXION_EXIT"
          else
            echo "test_status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Test Results Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const abstraxionSummary = `${{ steps.run-tests.outputs.abstraxion_summary }}`;
            const totalFailed = parseInt('${{ steps.run-tests.outputs.total_failed }}', 10) || 0;
            const testStatus = '${{ steps.run-tests.outputs.test_status }}' || 'unknown';

            if (!abstraxionSummary || abstraxionSummary.trim() === '') {
              console.log('No test results available, skipping comment');
              return;
            }

            const testSummary = '**@burnt-labs/abstraxion-js:**\n```\n' + abstraxionSummary + '\n```';

            let emoji = '✅';
            let statusText = 'All tests passed';

            if (testStatus === 'failed') {
              emoji = '❌';
              statusText = totalFailed > 0
                ? totalFailed + ' integration test(s) failed'
                : 'Integration test process failed';
            }

            const body = '## ' + emoji + ' Integration Test Results\n\n' +
              '**Status:** ' + statusText + '\n\n' +
              testSummary +
              '\n\n' +
              '---\n' +
              '*Environment: ${{ steps.config.outputs.test_environment }}* | *AA-API: ${{ steps.config.outputs.aa_api_url }}*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  dashboard-contract-testnet:
    name: Dashboard Contract — testnet
    needs: [build]
    runs-on: ubicloud-standard-8
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup integration environment (pnpm + deps + artifacts + Playwright)
        uses: ./.github/actions/setup-integration-env

      - name: Run Dashboard Contract Test (testnet, blocking)
        run: pnpm --filter @burnt-labs/abstraxion-js test:contract

  integration-test:
    name: Run integration tests (${{ github.event.inputs.test_environment || 'testnet' }})
    if: always()
    needs: [build, integration-suite, dashboard-contract-testnet]
    runs-on: ubicloud-standard-2
    steps:
      - name: Enforce integration gates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SDK_RESULT: ${{ needs.integration-suite.result }}
          CONTRACT_RESULT: ${{ needs.dashboard-contract-testnet.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ] || [ "$SDK_RESULT" != "success" ] || [ "$CONTRACT_RESULT" != "success" ]; then
            echo "Integration gate failed: build=$BUILD_RESULT sdk=$SDK_RESULT contract=$CONTRACT_RESULT"
            exit 1
          fi

          echo "Integration build, SDK suite, and testnet dashboard contract passed"

  # Informational-only mainnet contract regression detector.
  # Runs only on PRs targeting `main` (and on manual dispatch) to keep the
  # heavyweight Playwright run gated to release-relevant changes.
  #
  # `continue-on-error` lives on the test step (not the job) so the JOB
  # appears green in the checks list even when the test fails — engineers
  # don't see a red ❌ for an informational signal. The failed step itself
  # surfaces as a yellow ⚠️ in the run view, and the regression details land
  # in a PR comment.
  dashboard-contract-mainnet:
    name: Dashboard Contract — mainnet [informational]
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubicloud-standard-8
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup integration environment (pnpm + deps + artifacts + Playwright)
        uses: ./.github/actions/setup-integration-env

      - name: Run Dashboard Contract Test (mainnet)
        id: run-contract
        continue-on-error: true
        env:
          DASHBOARD_URL: https://settings.burnt.com
        run: pnpm --filter @burnt-labs/abstraxion-js test:contract

      - name: Annotate mainnet regression
        if: steps.run-contract.outcome == 'failure'
        run: |
          echo "::warning::Mainnet dashboard contract regression detected — see PR comment / run logs for details"

      - name: Comment on PR (mainnet contract failed)
        if: steps.run-contract.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ⚠️ Mainnet Dashboard Contract Regression [informational]',
              '',
              'The live SDK ↔ dashboard contract test failed against **mainnet** (`https://settings.burnt.com`).',
              '',
              'This job is **non-blocking** — the testnet contract test is the gating signal. ' +
              'A mainnet failure here means the deployed mainnet dashboard has drifted from the SDK contract ' +
              '(message routing, IFRAME_READY handshake, error codes, or the iframe-embed headers).',
              '',
              '### What to check',
              '- Cloudflare/edge headers for `https://settings.burnt.com` (`frame-ancestors`, `X-Frame-Options`, `connect-src`)',
              '- The deployed mainnet bundle vs. testnet — message-routing or response-shape drift',
              '- Whether mainnet is running an older `xion-dashboard-app` build than testnet',
              '',
              `> Workflow run: ${runUrl}`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
