# Sanctioned bespoke: github-workflows v1.8.0 has no standalone formatting flow.
# Its mandatory full quality suite is blocked by existing type/coverage failures;
# do not fill those gates with no-ops. Evidence: .github/CI-MIGRATION.md.

name: Format Check

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prettier:
    name: Check code formatting
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Check Prettier
        run: pnpm format:check
